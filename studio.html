<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen Create Studio</title>
<meta name="description" content="Material 3 Expressive design prototype of the Create workspace of an AI video app. Nothing is generated.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,100..112,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Theme and sidebar state before first paint, shared with Home (home.html) */
(function () {
  var d = document.documentElement, g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var t = g('qc_studio_theme'); if (t === 'light' || t === 'dark') d.dataset.theme = t;
  d.dataset.sidebar = g('qc_home_sidebar') === '"collapsed"' ? 'collapsed' : 'expanded';
  d.dataset.rail = String(innerWidth >= 720 && (d.dataset.sidebar === 'collapsed' || innerWidth < 1180));
})();
</script>
<style>
/* =============================================================================
   QWEN CREATE · CREATE WORKSPACE  (Material 3 Expressive design prototype)
   Layout: a navigation rail, a control panel (prompt + settings + Create) and a canvas.
   The canvas shows how it works with a real example: idea → storyboard → video.
   ========================================================================== */

/* ---- 1. TOKENS --------------------------------------------------------------- */
:root {
  --font: "Roboto Flex", Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  /* M3 Expressive motion: spatial springs overshoot, effects springs do not */
  --sp-fast: cubic-bezier(.42, 1.67, .21, .9);   --d-sp-fast: 350ms;
  --sp:      cubic-bezier(.38, 1.21, .22, 1);    --d-sp: 500ms;
  --sp-slow: cubic-bezier(.39, 1.29, .35, .98);  --d-sp-slow: 650ms;
  --fx:      cubic-bezier(.34, .8, .34, 1);      --d-fx: 200ms;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-2xl: 36px; --r-full: 999px;

  /* "Aquatic Harmony" palette from index.html: deep #004040 · dark #006060 · teal #008080 · bright #00A0A0 · light #00C0C0 */
  /* light scheme */
  color-scheme: light;
  --bg: #F5F8F8; --s1: #FFFFFF; --s2: #F0F4F4; --s3: #E9F0F0; --s4: #E0E7E7;
  --on: #122121; --on-v: #5E6F6F; --outline: #8FA0A0; --outline-v: #E0E7E7;
  --pri: #008080; --on-pri: #FFFFFF; --err: #C4353B; --inv-pri: #7FD6D6;
  --sec-c: #CCE8E7; --on-sec-c: #051F1F;
  --ter: #008080; --on-ter: #FFFFFF; --ter-c: #E5F3F3; --on-ter-c: #006060;
  --inv: #122121; --on-inv: #FFFFFF;
  --menu: #FFFFFF; --shadow: rgba(18, 33, 33, .14);
  --avatar: linear-gradient(135deg, #006060, #00A0A0);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #061212; --s1: #0B1C1C; --s2: #112626; --s3: #142C2C; --s4: #1C3434;
  --on: #E4EEEE; --on-v: #8BA3A3; --outline: #5F7979; --outline-v: #1C3434;
  --pri: #00C0C0; --on-pri: #002A2A; --err: #FF8A80; --inv-pri: #006A6A;
  --sec-c: #324B4A; --on-sec-c: #CCE8E7;
  --ter: #00C0C0; --on-ter: #002A2A; --ter-c: #004040; --on-ter-c: #00C0C0;
  --inv: #E4EEEE; --on-inv: #0B1C1C;
  --menu: #112626; --shadow: rgba(0, 0, 0, .5);
  --avatar: linear-gradient(135deg, #00A0A0, #00C0C0);
}

/* ---- 2. BASE ----------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--on); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; transition: background-color .3s; overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ter); outline-offset: 2px; }
::selection { background: var(--ter-c); color: var(--on-ter-c); }
.i { width: var(--s, 20px); height: var(--s, 20px); fill: currentColor; flex: none; display: block; }
.tnum { font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.scroll-x { overflow-x: auto; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--s4); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

/* ---- 3. WORKSPACE LAYOUT ----------------------------------------------------- */
.ws { --sb-w: 272px; display: grid; grid-template-columns: var(--sb-w) minmax(0, 1fr); height: 100vh; height: 100dvh; transition: grid-template-columns .3s ease-in-out; }
:root[data-rail="true"] .ws { --sb-w: 72px; }
.ws-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.topbar { height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; font-stretch: 110%; white-space: nowrap; }
.brand-mark { width: 36px; height: 36px; position: relative; display: grid; place-items: center; color: var(--on-pri); flex: none; }
.brand-mark svg.shape { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--pri); transition: transform var(--d-sp-slow) var(--sp-slow); }
.brand:hover .brand-mark svg.shape { transform: rotate(40deg); }
.brand-mark .i { position: relative; --s: 18px; }
.crumb { color: var(--on-v); font-size: 14px; font-weight: 500; white-space: nowrap; }
.crumb b { color: var(--on); font-weight: 650; }
.ws-body { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 12px 12px; }
.topbar .brand { display: none; }   /* the brand sits in the sidebar; shown here only on phones */

/* Sidebar: the same floating sidebar as Home (home.html), drawn with Home's own colours,
   icons and font so moving between the pages feels like one app. 272px expanded / 72px rail
   (collapsed, or narrower than 1180px); a bottom tab bar on phones. Its collapsed state, theme,
   announcement and the new-user preview are shared with Home through localStorage. */
.sidebar {
  --surface-2: #171c1d; --surface-3: #1e2426; --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .12);
  --text: #edf1f1; --text-2: #a7b1b3; --text-3: #858f92;
  --accent: #3ecfc0; --accent-ink: #032220; --accent-soft: rgba(62, 207, 192, .1);
  --bm-bg: #14302d; --bm-fg: #3ecfc0;
  --sb-bg: #111516; --sb-border: rgba(255, 255, 255, .08); --sb-field: #1b2123;
  --sb-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 2px 6px rgba(0, 0, 0, .25), 0 28px 56px -28px rgba(0, 0, 0, .85);
  --sel-2: #2bb3a5; --sel-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset, 0 0 0 1px rgba(62, 207, 192, .5), 0 6px 16px -6px rgba(62, 207, 192, .55);
}
:root[data-theme="light"] .sidebar {
  --surface-2: #f6f7f7; --surface-3: #eceff0; --line: rgba(12, 22, 24, .08); --line-2: rgba(12, 22, 24, .14);
  --text: #0f1415; --text-2: #4c585b; --text-3: #687377;
  --accent: #0d8a80; --accent-ink: #ffffff; --accent-soft: rgba(13, 138, 128, .08);
  --bm-bg: #dff3f1; --bm-fg: #0d8a80;
  --sb-bg: #fafbfb; --sb-border: #ffffff; --sb-field: #eef0f1;
  --sb-shadow: 0 0 0 1px rgba(12, 22, 24, .05), 0 1px 2px rgba(12, 22, 24, .05), 0 18px 40px -18px rgba(12, 22, 24, .22);
  --sel-2: #0a6f67; --sel-shadow: 0 1px 0 rgba(255, 255, 255, .25) inset, 0 0 0 1px #0a6f67, 0 6px 16px -6px rgba(13, 138, 128, .5);
}
.sidebar { position: sticky; top: 12px; z-index: 40; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; height: calc(100vh - 24px); height: calc(100dvh - 24px); margin: 12px 0 12px 12px; padding: 12px; overflow: hidden auto; scrollbar-width: none; border-radius: 24px; border: 1px solid var(--sb-border); background: var(--sb-bg); box-shadow: var(--sb-shadow); color: var(--text); font: 400 14px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; transition: padding .3s ease-in-out; }
.sidebar::-webkit-scrollbar { display: none; }
.sidebar ul { margin: 0; padding: 0; list-style: none; }
.sidebar p, .sidebar strong { margin: 0; }
.sidebar a { color: inherit; text-decoration: none; }
.sidebar button { padding: 0; border: 0; background: none; cursor: pointer; }
.sidebar :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.si { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:root[data-rail="true"] .sidebar { padding: 12px 11px; }
@media (max-height: 719px) { .sidebar .sb-announce { display: none; } }
.sb-scroll { display: flex; flex-direction: column; gap: 12px; flex: none; margin: -8px; padding: 8px; }
.sb-bottom { display: flex; flex-direction: column; gap: 12px; flex: none; }
.sb-c { display: flex; align-items: center; min-width: 0; max-width: 100%; overflow: hidden; white-space: nowrap; transition: max-width .3s ease-in-out, opacity .3s ease-in-out, filter .3s ease-in-out; }
:root[data-rail="true"] .sb-c { max-width: 0; opacity: 0; filter: blur(3px); }
.sb-in { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sb-ib { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; color: var(--text-2); flex: none; transition: background-color .15s, color .15s; }
.sidebar .sb-ib:hover { background: var(--surface-3); color: var(--text); }
.sb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; transition: gap .3s ease-in-out; }
:root[data-rail="true"] .sb-head { flex-direction: column-reverse; align-items: flex-start; gap: 10px; }
.sb-brand { display: flex; align-items: center; gap: 10px; min-width: 0; border-radius: 12px; }
.sb-mark { width: 36px; height: 36px; flex: none; }
.sb-mark .bm-bg { fill: var(--bm-bg); } .sb-mark .bm-fg { fill: var(--bm-fg); }
.sb-name { font-weight: 600; font-size: 15px; letter-spacing: -.015em; }
.sb-toggle { display: none; width: 36px; height: 36px; border-radius: 12px; color: var(--text-3); }
.sb-toggle .si { transform: scaleX(-1); transition: transform .3s ease-in-out; }
:root[data-sidebar="collapsed"] .sb-toggle .si { transform: none; }
@media (min-width: 1180px) { .sidebar .sb-toggle { display: inline-grid; } }
.sb-nav ul { display: flex; flex-direction: column; gap: 4px; }
.sb-nav-main ul { padding: 0 2px; transition: padding .3s ease-in-out; }
:root[data-rail="true"] .sb-nav-main ul { padding: 0; }
.sb-nav a, .sb-nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 36px; padding: 8px; border-radius: 12px; overflow: hidden; color: var(--text-2); font-size: 14px; font-weight: 500; transition: width .3s ease-in-out, background-color .15s, color .15s; }
:root[data-rail="true"] .sb-nav a, :root[data-rail="true"] .sb-nav button { width: 36px; }
.sb-nav a:hover, .sb-nav button:hover { background: var(--surface-3); color: var(--text); }
.sb-nav .si { color: var(--text-3); transition: color .15s; }
.sb-nav a:hover .si, .sb-nav button:hover .si { color: var(--text-2); }
.sb-nav a[aria-current="page"] { background: linear-gradient(to bottom, var(--accent), var(--sel-2)); color: var(--accent-ink); box-shadow: var(--sel-shadow); }
.sb-nav a[aria-current="page"] .si { color: var(--accent-ink); }
.sb-badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sb-badge:empty { display: none; }
.sb-announce { position: relative; display: grid; gap: 4px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: radial-gradient(120% 90% at 100% 0%, var(--accent-soft), transparent 60%), var(--surface-2); animation: sb-fade .25s ease-out .25s both; }
@keyframes sb-fade { from { opacity: 0; } }
.sb-announce-ic { display: grid; place-items: center; width: 28px; height: 28px; margin-bottom: 4px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
.sb-announce-ic .si { width: 16px; height: 16px; }
.sb-announce strong { font-size: 13px; font-weight: 600; }
.sb-announce p { font-size: 12.5px; line-height: 1.45; color: var(--text-2); }
.sidebar .sb-announce-cta { justify-self: start; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--accent); }
.sb-announce-cta:hover { text-decoration: underline; }
.sidebar .sb-announce-x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 8px; }
.sb-announce-x .si { width: 14px; height: 14px; }
:root[data-rail="true"] .sb-announce { display: none; }
.sb-theme { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sb-field); }
.sb-theme label { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; transition: background-color .15s, color .15s, box-shadow .15s; }
.sb-theme label .si { width: 16px; height: 16px; }
.sb-theme input { position: absolute; opacity: 0; pointer-events: none; }
.sb-theme label:has(input:checked) { background: var(--sb-bg); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .18), 0 0 0 1px var(--line); }
.sb-theme label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
.sidebar .sb-theme-btn { display: none; width: 36px; height: 36px; border-radius: 999px; background: var(--sb-field); }
:root[data-rail="true"] .sb-theme { display: none; }
:root[data-rail="true"] .sidebar .sb-theme-btn { display: inline-grid; }
.sb-foot { display: grid; gap: 8px; }
.sb-me { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 7px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); transition: padding .3s ease-in-out, background-color .3s, border-color .3s; }
:root[data-rail="true"] .sb-me { padding: 1px; background: transparent; border-color: transparent; }
.sb-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 600; color: var(--accent-ink); background: var(--accent); }
.sb-me-text { display: grid; min-width: 0; line-height: 1.3; }
.sb-me-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.sb-me-plan { font-size: 12px; color: var(--text-3); }
.sb-proto { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 12px; border: 1px dashed var(--line-2); font-size: 12px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
:root[data-rail="true"] .sb-proto { display: none; }
.sb-switch { appearance: none; -webkit-appearance: none; position: relative; width: 36px; height: 20px; margin: 0; flex: none; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line-2); cursor: pointer; transition: background-color .2s, border-color .2s; }
.sb-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-2); transition: transform .22s cubic-bezier(.2, .8, .2, 1), background-color .2s; }
.sb-switch:checked { background: var(--accent); border-color: var(--accent); }
.sb-switch:checked::after { transform: translateX(16px); background: var(--accent-ink); }

/* Control panel */
.panel { width: 400px; flex: none; display: flex; flex-direction: column; background: var(--s1); border-radius: var(--r-xl); overflow: hidden; box-shadow: 0 0 0 1px var(--outline-v); }
.panel-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 8px; scrollbar-width: thin; }
.panel-foot { flex: none; padding: 14px 18px 18px; border-top: 1px solid var(--outline-v); background: var(--s1); }
.p-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--on-v); margin: 0 4px 8px; }
.p-label .i { --s: 15px; color: var(--ter); }
.p-label .grow { text-align: right; text-transform: none; letter-spacing: 0; font-weight: 500; }
/* Your idea: the AI-Input design from Uiverse.io (by AshtonLiou), in the page's colors.
   A glowing input box. */
.ai { position: relative; display: flex; flex-direction: column; align-items: center; isolation: isolate; }
.ai-box { position: relative; width: 100%; background: var(--s2); border: 2px solid color-mix(in srgb, var(--on) 10%, transparent); border-radius: 18px; overflow: hidden; z-index: 0;
  transition: border-color .3s, transform .2s; }
.ai-box::before { content: ""; position: absolute; top: -9rem; left: -6rem; width: 15rem; height: 15rem; border-radius: 50%; pointer-events: none; z-index: -1; opacity: .55; filter: blur(10px);
  background: radial-gradient(circle, color-mix(in srgb, var(--pri) 60%, #fff) 10%, color-mix(in srgb, var(--pri) 25%, transparent) 25%, transparent 70%);
  transition: all 1s cubic-bezier(.3, 1.5, .6, 1); }
.ai-box:focus-within::before { top: -6rem; left: 50%; filter: blur(50px); }
.ai-box:focus-within { border-color: color-mix(in srgb, var(--pri) 55%, transparent); }
.ai-wrap { display: flex; flex-direction: column; padding: 12px 12px 10px; }
/* The idea is a rich editor (contenteditable) so it can hold inline @image chips */
.ai-ed { display: block; width: 100%; min-height: 130px; max-height: 300px; overflow-y: auto; padding: 4px; color: var(--on); font: 400 16px/1.55 var(--font); outline: none; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; scrollbar-width: thin; }
/* Animated placeholder: while the box is empty, ideas type themselves out (as in Home's "How it works") */
.ai-wrap { position: relative; }
.ai-ph { position: absolute; top: 16px; left: 16px; right: 16px; color: var(--on-v); opacity: .85; font: 400 16px/1.55 var(--font); white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none; transition: opacity .45s ease; }
.ai-ph[hidden] { display: none; }
.ai-ph.fade { opacity: 0; }
.ai-ph .tw-caret { display: none; width: 2px; height: 1.15em; margin-left: 2px; vertical-align: -.2em; border-radius: 1px; background: var(--pri); }
.ai-ph.on .tw-caret { display: inline-block; animation: tw-blink 1s steps(1) infinite; }
.ai-ph.typing .tw-caret { animation: none; }   /* solid while typing, blinks while it holds */
.ai-box:focus-within .ai-ph .tw-caret { display: none; }   /* the real caret is there */
@keyframes tw-blink { 50% { opacity: 0; } }
.ai-ed[contenteditable="false"] { opacity: .6; cursor: default; }
.ai-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.ai-left, .ai-right { display: flex; align-items: center; gap: 6px; }
.ai-btn { width: 38px; height: 38px; padding: 0; border: 2px solid color-mix(in srgb, var(--on) 6%, transparent); border-radius: 50%; background: transparent; color: var(--on-v);
  display: grid; place-items: center; cursor: pointer; transition: all .2s ease-in-out, transform .1s ease-in-out; }
.ai-btn:hover { color: var(--on); box-shadow: .2rem .2rem .5rem .2rem rgba(0, 0, 0, .15); }
.ai-btn:active { transform: scale(.9); }
.ai-btn svg { width: 18px; height: 18px; fill: currentColor; }
.ai-count { font-size: 11px; color: var(--on-v); margin-right: 2px; }
.ai-send { width: 40px; height: 40px; padding: 0; border: 0; background: none; color: var(--pri); cursor: pointer; display: grid; place-items: center; transition: transform .2s ease-in-out; }
.ai-send svg { width: 34px; height: 34px; fill: currentColor; }
.ai-send:hover:not(:disabled) { transform: translateY(-10%) scale(1.1); }
.ai-send:disabled { opacity: .4; cursor: default; }
.text-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; margin-left: -10px; border: 0; border-radius: var(--r-full); background: none; color: var(--ter); font-weight: 650; font-size: 13px; cursor: pointer; transition: background-color var(--d-fx), transform var(--d-sp-fast) var(--sp-fast); }
.text-btn:hover { background: color-mix(in srgb, var(--ter) 10%, transparent); }
.text-btn:active { transform: scale(.96); }
.text-btn .i { --s: 16px; }
.p-sec { margin-top: 22px; }
.p-note { font-size: 12px; color: var(--on-v); margin: 8px 6px 0; }
.p-note .ter { color: var(--ter); }
/* Settings as a grouped list of rows */
.set-list { display: flex; flex-direction: column; gap: 3px; }
.set-row { width: 100%; min-height: 62px; display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 14px; border: 0; border-radius: 8px; background: var(--s2); color: var(--on); text-align: left; cursor: pointer;
  transition: border-radius var(--d-sp-fast) var(--sp-fast), background-color var(--d-fx), color var(--d-fx), transform var(--d-sp-fast) var(--sp-fast); }
.set-row:first-child { border-radius: 22px 22px 8px 8px; }
.set-row:last-child { border-radius: 8px 8px 22px 22px; }
.set-row:hover { background: var(--s3); }
.set-row:active:not(:disabled) { transform: scale(.98); }
.set-row:disabled { opacity: .5; cursor: default; }
.set-row .lead { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--s1); color: var(--on-v); flex: none; }
.set-row.custom .lead { color: var(--on); }
.set-row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.set-row .k { font-size: 12px; color: var(--on-v); }
.set-row .v { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-row .tag { height: 24px; padding: 0 9px; border-radius: 12px; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; flex: none; }
.set-row.auto .tag { background: var(--ter-c); color: var(--on-ter-c); }
.set-row.custom .tag { box-shadow: inset 0 0 0 1px var(--outline); color: var(--on-v); }
.set-row .chev { color: var(--on-v); display: grid; transition: transform var(--d-sp) var(--sp); }
.set-row.open { background: var(--pri); color: var(--on-pri); border-radius: 22px; }
.set-row.open .k, .set-row.open .chev { color: inherit; opacity: .85; }
.set-row.open .lead { background: color-mix(in srgb, var(--on-pri) 15%, transparent); color: inherit; }
.set-row.open .tag { background: color-mix(in srgb, var(--on-pri) 18%, transparent); color: inherit; box-shadow: none; }
.set-row.open .chev { transform: translateX(3px); }
.set-row .bump { display: inline-block; animation: bump var(--d-sp) var(--sp); }
/* Audio switch row (M3 switch with a check in the handle) */
.set-row.toggle .v { font-size: 14px; font-weight: 600; }
.set-row.toggle.is-on .lead { color: var(--ter); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 16px; flex: none; background: var(--s4); box-shadow: inset 0 0 0 2px var(--outline); transition: background-color var(--d-fx), box-shadow var(--d-fx); }
.switch .knob { position: absolute; left: 8px; top: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); display: grid; place-items: center; color: var(--pri);
  transition: left var(--d-sp) var(--sp), top var(--d-sp) var(--sp), width var(--d-sp) var(--sp), height var(--d-sp) var(--sp), background-color var(--d-fx); }
.switch.on { background: var(--pri); box-shadow: none; }
.switch.on .knob { left: 24px; top: 4px; width: 24px; height: 24px; background: var(--on-pri); }
.set-row.toggle:active .switch .knob { width: 28px; height: 28px; top: 2px; left: 2px; }
.set-row.toggle:active .switch.on .knob { left: 22px; }

/* Reference images: a file upload block, rebuilt from Aceternity UI's FileUpload (React) in plain CSS/JS */
.fu { position: relative; display: block; width: 100%; padding: 22px 16px 18px; border: 1.5px dashed var(--outline-v); border-radius: 22px; background: var(--s1); overflow: hidden; cursor: pointer; text-align: center; outline: none;
  transition: border-color var(--d-fx), background-color var(--d-fx); }
.fu:hover { border-color: var(--outline); }
.fu:focus-visible { box-shadow: 0 0 0 2px var(--ter); }
.fu.disabled { opacity: .5; pointer-events: none; }
.fu.full { cursor: default; }
.fu-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.fu-title { margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 750; font-size: 15px; color: var(--on); }
.fu-title .pill { font-size: 11px; font-weight: 650; color: var(--on-v); padding: 2px 8px; border-radius: 10px; background: var(--s2); box-shadow: 0 0 0 1px var(--outline-v); }
.fu-sub { margin: 4px 0 0; max-width: 280px; font-size: 13px; line-height: 1.45; color: var(--on-v); }
.fu-hint { margin: 16px 0 0; font-size: 11.5px; color: var(--on-v); opacity: .8; }
/* The floating upload card: slides up-right on hover and reveals a dashed outline behind it */
.fu-stage { position: relative; width: 112px; height: 92px; margin-top: 20px; }
.fu-card { position: absolute; inset: 0; z-index: 2; border-radius: 12px; background: var(--s2); color: var(--on-v); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: 0 10px 30px -8px var(--shadow), 0 0 0 1px var(--outline-v); transition: transform 450ms var(--sp), color var(--d-fx), opacity var(--d-fx); }
.fu-outline { position: absolute; inset: 0; z-index: 1; border-radius: 12px; border: 1.5px dashed var(--pri); opacity: 0; transition: opacity var(--d-fx); }
.fu:not(.full):hover .fu-card { transform: translate(16px, -16px); opacity: .92; }
.fu:not(.full):hover .fu-outline { opacity: 1; }
.fu-card .drop-text { display: none; font-size: 13px; font-weight: 650; color: var(--on); }
.fu.drag, .panel.drop-on .fu:not(.full) { border-color: var(--pri); background: color-mix(in srgb, var(--pri) 6%, var(--s1)); }
.panel.drop-on .fu-card { transform: translate(16px, -16px); color: var(--pri); }
.panel.drop-on .fu-card .drop-text { display: block; }
.panel.drop-on .fu-outline { opacity: 1; }
/* File cards */
.fu-files { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.fu-file { display: flex; gap: 12px; padding: 10px; border-radius: 14px; background: var(--s2); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--outline-v); }
.fu-file.new { animation: fu-in 450ms var(--sp) both; }
@keyframes fu-in { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
.fu-file img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; background: var(--s3); }
.fu-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.fu-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--on-v); }
.fu-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--on); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fu-size { flex: none; padding: 2px 8px; border-radius: 8px; background: var(--s1); box-shadow: 0 0 0 1px var(--outline-v); font-size: 11.5px; }
.fu-type { padding: 1px 6px; border-radius: 6px; background: var(--s3); font-size: 11.5px; }
.fu-x { width: 26px; height: 26px; flex: none; margin: -4px -4px -4px 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: transparent; color: var(--on-v); cursor: pointer;
  transition: background-color var(--d-fx), color var(--d-fx), transform var(--d-sp-fast) var(--sp-fast); }
.fu-x:hover { background: color-mix(in srgb, var(--on) 10%, transparent); color: var(--on); }
.fu-x:active { transform: scale(.9); }
/* Each image card adds its @mention to the idea when clicked */
.fu-file[data-ref-open] { cursor: pointer; transition: box-shadow var(--d-fx); }
.fu-file[data-ref-open]:hover { box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1.5px var(--pri); }
.fu-file[data-ref-open]:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
.fu-row .fu-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fu-row > span:last-child:not(.fu-size) { flex: none; }
/* Inline @mention chips in the idea: thumbnail + name, backed by the image's id */
.mention { display: inline-flex; align-items: center; gap: 4px; height: 1.45em; margin: 0 1px; padding: 0 7px 0 2px; vertical-align: -.32em; border-radius: 7px;
  background: color-mix(in srgb, var(--pri) 15%, var(--s2)); color: color-mix(in srgb, var(--pri) 70%, var(--on)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pri) 35%, transparent);
  font-size: .92em; font-weight: 600; line-height: 1; white-space: nowrap; cursor: pointer; user-select: all; -webkit-user-select: all; transition: box-shadow var(--d-fx); }
.mention:hover { box-shadow: inset 0 0 0 1.5px var(--pri); }
.mention img { width: 1.15em; height: 1.15em; flex: none; border-radius: 4px; object-fit: cover; }
.mention-t::before { content: "@"; opacity: .65; }
.mention .mention-warn { display: none; width: 1em; height: 1em; }
.mention.broken { background: color-mix(in srgb, var(--err) 12%, var(--s2)); color: var(--err); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--err) 50%, transparent); }
.mention.broken .mention-t { text-decoration: line-through; text-decoration-thickness: 1px; }
.mention.broken .mention-warn { display: block; }
.ai-warn { display: flex; align-items: center; gap: 6px; margin: 4px 4px 0; font-size: 12.5px; color: var(--err); }
.ai-warn[hidden] { display: none; }
.ai-warn .i { --s: 15px; }
 /* @ menu: only the attached images */
.mmenu { position: fixed; z-index: 90; width: 280px; max-width: calc(100vw - 24px); max-height: 320px; overflow: auto; padding: 6px; border-radius: var(--r-lg); background: var(--menu); box-shadow: 0 0 0 1px var(--outline-v), 0 16px 40px -12px var(--shadow); animation: menu-in .16s var(--fx); }
.mmenu[hidden] { display: none; }
.mm-head { padding: 6px 8px 4px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--on-v); }
.mm-opt { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.mm-opt:hover, .mm-opt[aria-selected="true"] { background: var(--s3); }
.mm-opt img { width: 38px; height: 38px; flex: none; border-radius: 8px; object-fit: cover; }
.mm-t { display: grid; min-width: 0; line-height: 1.3; }
.mm-t b { font-size: 13.5px; font-weight: 650; }
.mm-t small { font-size: 12px; color: var(--on-v); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mm-empty { margin: 0; padding: 8px; font-size: 13px; color: var(--on-v); }
.mm-add { display: flex; align-items: center; gap: 8px; width: 100%; height: 38px; margin-top: 4px; padding: 0 10px; border: 0; border-radius: 10px; background: none; color: var(--ter); font: 650 13px var(--font); cursor: pointer; }
.mm-add:hover { background: color-mix(in srgb, var(--ter) 10%, transparent); }
.mm-add .i { --s: 18px; }
.mm-tip { margin: 4px 0 0; padding: 6px 8px 2px; border-top: 1px solid var(--outline-v); font-size: 11.5px; color: var(--on-v); }

.est-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--on-v); margin-bottom: 12px; }
.est-row b { color: var(--on); font-weight: 650; }
.panel-foot .create-btn { width: 100%; }

/* Canvas */
.canvas { flex: 1; min-width: 0; overflow-y: auto; border-radius: var(--r-xl); background-color: var(--bg); box-shadow: inset 0 0 0 1px var(--outline-v); container-type: inline-size; scrollbar-width: thin; }
.canvas-in { max-width: 1180px; margin: 0 auto; padding: 40px 36px 48px; }

/* ---- 4. COMPONENTS ----------------------------------------------------------- */
/* State layer shared by everything pressable */
.sl { position: relative; isolation: isolate; }
.sl::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; pointer-events: none; transition: opacity 150ms var(--fx); z-index: -1; }
.sl:hover::after { opacity: .08; }
.sl:active::after { opacity: .12; }

.btn { --h: 48px; height: var(--h); padding: 0 22px; border: 0; border-radius: var(--r-full); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 650; font-size: 15px; cursor: pointer; white-space: nowrap; flex: none;
  transition: border-radius var(--d-sp-fast) var(--sp-fast), transform var(--d-sp-fast) var(--sp-fast), background-color var(--d-fx) var(--fx), color var(--d-fx) var(--fx), opacity var(--d-fx); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { cursor: default; }
.btn.sm { --h: 40px; padding: 0 16px; font-size: 14px; }
.btn.lg { --h: 56px; padding: 0 26px; font-size: 16px; border-radius: 20px; }
.btn.xl { --h: 64px; padding: 0 30px; font-size: 17px; border-radius: 22px; }
.btn .i { --s: 20px; }
.btn-filled { background: var(--pri); color: var(--on-pri); }
.btn-tonal { background: var(--sec-c); color: var(--on-sec-c); }
.create-btn .i { transition: transform var(--d-sp) var(--sp); }
.create-btn:hover .i { transform: translateX(3px); }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: var(--r-full); display: grid; place-items: center; background: transparent; color: var(--on-v); cursor: pointer; flex: none;
  transition: background-color var(--d-fx), color var(--d-fx), transform var(--d-sp-fast) var(--sp-fast); }
.icon-btn:hover { color: var(--on); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.sm .i { --s: 18px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; background: var(--avatar); color: var(--on-pri); font-weight: 800; font-size: 15px; display: grid; place-items: center; flex: none; transition: transform var(--d-sp-fast) var(--sp-fast); }
.avatar:active { transform: scale(.92); }

/* Chips */
.chip { height: 36px; padding: 0 14px; border: 1px solid var(--outline-v); border-radius: var(--r-md); background: transparent; color: var(--on); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 550; cursor: pointer; white-space: nowrap; flex: none;
  transition: background-color var(--d-fx), border-color var(--d-fx), color var(--d-fx), transform var(--d-sp-fast) var(--sp-fast); }
.chip:active { transform: scale(.96); }
.chip .i { --s: 18px; color: var(--on-v); }
.chip.sel { background: var(--sec-c); color: var(--on-sec-c); border-color: transparent; }
.chip.sel .i { color: inherit; }
.assist { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border-radius: var(--r-sm); background: var(--ter-c); color: var(--on-ter-c); font-size: 13px; font-weight: 650; white-space: nowrap; }
.assist .i { --s: 16px; }

@keyframes bump { from { transform: translateY(6px) scale(.9); opacity: .2; } }
.ratio-g { display: inline-block; width: calc(var(--w) * 1.1px); height: calc(var(--h) * 1.1px); border: 2px solid currentColor; border-radius: 3px; }

/* Shapes */
.shape-badge { position: relative; display: grid; place-items: center; flex: none; width: var(--sz, 40px); height: var(--sz, 40px); color: var(--on-pri); font-weight: 800; }
.shape-badge > svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--fill, var(--pri)); }
.shape-badge > span, .shape-badge > .i { position: relative; }

/* Loading indicator: a shape that morphs (driven by JS) */
.loader { display: inline-block; width: var(--sz, 24px); height: var(--sz, 24px); background: currentColor; flex: none; clip-path: circle(45%); }

/* Snackbar */
.snack { position: fixed; left: 50%; bottom: 28px; z-index: 80; display: flex; align-items: center; gap: 10px; min-height: 52px; max-width: min(560px, calc(100vw - 32px));
  padding: 8px 8px 8px 18px; border-radius: var(--r-lg); background: var(--inv); color: var(--on-inv); box-shadow: 0 12px 40px -10px var(--shadow);
  transform: translate(-50%, 24px) scale(.96); opacity: 0; pointer-events: none; transition: transform var(--d-sp) var(--sp), opacity var(--d-fx); font-weight: 500; font-size: 14px; }
.snack.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.snack .msg { flex: 1; }
.snack-act { height: 36px; padding: 0 12px; border: 0; border-radius: var(--r-full); background: none; color: var(--inv-pri); font: 700 14px var(--font); cursor: pointer; }
.snack-act:hover { background: color-mix(in srgb, var(--on-inv) 10%, transparent); }

/* Menus: floating groups with gaps, selected item becomes a pill */
.menu { position: fixed; z-index: 70; display: flex; flex-direction: column; gap: 3px; max-height: min(640px, 80vh); overflow: auto; padding: 4px; scrollbar-width: thin;
  transform-origin: top center; animation: menu-in var(--d-sp-fast) var(--sp-fast); }
.menu.up { transform-origin: bottom center; }
.menu.side { transform-origin: left top; }
@keyframes menu-in { from { opacity: 0; transform: scale(.92) translateY(-6px); } }
.mgroup { background: var(--menu); border-radius: var(--r-sm); padding: 6px; box-shadow: 0 10px 30px -10px var(--shadow), 0 0 0 1px var(--outline-v); }
.mgroup:first-child { border-top-left-radius: 24px; border-top-right-radius: 24px; }
.mgroup:last-child { border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
.gh { display: flex; align-items: center; gap: 6px; padding: 8px 12px 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--on-v); }
.gh .i { --s: 14px; color: var(--ter); }
.gh.sub { padding-top: 10px; text-transform: none; letter-spacing: 0; font-weight: 600; }
.mi { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 0; background: none; border-radius: var(--r-md); text-align: left; cursor: pointer; color: var(--on);
  transition: border-radius var(--d-sp-fast) var(--sp-fast), background-color var(--d-fx); }
.mi:hover, .mi:focus-visible { background: color-mix(in srgb, var(--on) 7%, transparent); outline: none; }
.mi.sel { background: var(--ter-c); color: var(--on-ter-c); border-radius: 22px; }
.mi[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
.mi[aria-disabled="true"]:hover { background: none; }
.mi-icon { width: 20px; display: grid; place-items: center; color: var(--on-v); flex: none; }
.mi-icon.ter { color: var(--ter); }
.mi.sel .mi-icon { color: inherit; }
.mi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mi-label { font-weight: 650; font-size: 14px; }
.mi-side { font-weight: 450; color: var(--on-v); }
.mi.sel .mi-side, .mi.sel .mi-hint { color: inherit; opacity: .8; }
.mi-hint { font-size: 12px; color: var(--on-v); line-height: 1.35; }
.mi-check { width: 18px; flex: none; display: grid; }
.mnote { padding: 8px 12px; font-size: 12px; color: var(--on-v); line-height: 1.45; }
.mnote b { color: var(--on); }
.bgroup { display: flex; gap: 2px; padding: 2px 4px 6px; }
.bg-btn { flex: 1; min-width: 0; min-height: 60px; padding: 8px 6px; border: 0; cursor: pointer; background: var(--sec-c); color: var(--on-sec-c); border-radius: var(--r-sm);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: border-radius var(--d-sp-fast) var(--sp-fast), transform var(--d-sp-fast) var(--sp-fast), background-color var(--d-fx), color var(--d-fx), flex-grow var(--d-sp) var(--sp); }
.bg-btn:first-child { border-radius: 24px var(--r-sm) var(--r-sm) 24px; }
.bg-btn:last-child { border-radius: var(--r-sm) 24px 24px var(--r-sm); }
.bg-btn.sel { background: var(--pri); color: var(--on-pri); border-radius: 30px; flex-grow: 1.25; }
.bg-btn:active { transform: scale(.96); }
.bg-t { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.bg-t .i { --s: 16px; }
.bg-m { font-size: 11px; opacity: .8; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px 8px; }
.mchip { height: 36px; min-width: 52px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--outline-v); background: transparent; cursor: pointer; font-weight: 650; font-size: 14px;
  transition: border-radius var(--d-sp-fast) var(--sp-fast), transform var(--d-sp-fast) var(--sp-fast), background-color var(--d-fx); }
.mchip.sel { background: var(--pri); color: var(--on-pri); border-color: transparent; border-radius: 18px; }
.mchip:active { transform: scale(.94); }
/* Slider (same as index.html / custom_slider.dart): thin track, round thumb, value bubble while dragging */
.mslider { padding: 6px 12px 10px; }
.mslider .row { justify-content: space-between; font-size: 13px; color: var(--on-v); margin-bottom: 2px; }
.mslider .row b { color: var(--on); font-size: 14px; }
.slider { position: relative; height: 40px; display: flex; align-items: center;
  --sl-on: var(--pri); --sl-off: color-mix(in srgb, var(--pri) 20%, transparent); --sl-thumb: var(--pri); --sl-overlay: color-mix(in srgb, var(--pri) 12%, transparent); }
.slider input { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; margin: 0; }
.slider input:focus-visible { outline: none; }
.slider input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--sl-on) var(--pct), var(--sl-off) var(--pct)); }
.slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: var(--sl-thumb); box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 0 0 0 var(--sl-overlay); transition: box-shadow .15s; }
.slider input:hover::-webkit-slider-thumb, .slider input:focus-visible::-webkit-slider-thumb { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 0 0 10px var(--sl-overlay); }
.slider input::-moz-range-track { height: 4px; border-radius: 2px; background: var(--sl-off); }
.slider input::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--sl-on); }
.slider input::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--sl-thumb); }
.slider-bubble { position: absolute; bottom: 34px; transform: translateX(-50%) scale(.4); transform-origin: 50% 120%; opacity: 0; pointer-events: none;
  background: var(--pri); color: var(--on-pri); font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 16px; transition: opacity .12s, transform .15s cubic-bezier(.2,.9,.3,1.3); }
.slider-bubble::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 0 0 3px 0; }
.slider.dragging .slider-bubble { opacity: 1; transform: translateX(-50%) scale(1); }

/* Motion helpers */
.enter { animation: enter var(--d-sp-slow) var(--sp-slow) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes enter { from { opacity: 0; transform: translateY(22px) scale(.98); } }
.shake { animation: shake .4s; }

<script>

const MAX_IDEA = 4000;

const EXAMPLES = [

/* The "How it works" example: a real project made with the app

const KEEPER_DIR = 'example/keepers-watch/';

  title: 'The Keeper\'s Watch',
  prompt: 'A lighthouse keeper climbs the spiral stairs at dusk, lights the great lamp, and watches a small fishing boat find its way home through the fog.',

/* Video models. EXAMPLE DATA: the IDs match real OpenRouter video models, but prices, speeds and

const ALL_RATIOS = ['16:9', '9:16', '1:1'];
const VIDEO_MODELS = [
  { id: 'bytedance/seedance-2.0-fast', name: 'Seedance 2.0 Fast', provider: 'ByteDance', tier: 'draft', usdPerSec: 0.03, minPer10s: 1, maxRes: '1080p', ratios: ALL_RATIOS },
  { id: 'alibaba/wan-2.7', name: 'Wan 2.7', provider: 'Alibaba', tier: 'draft', usdPerSec: 0.04, minPer10s: 2, maxRes: '1080p', ratios: ALL_RATIOS },
  { id: 'google/veo-3.1-lite', name: 'Veo 3.1 Lite', provider: 'Google', tier: 'draft', usdPerSec: 0.05, minPer10s: 1.5, maxRes: '720p', ratios: ALL_RATIOS },
  { id: 'heygen/heygen-video-1', name: 'HeyGen Video', provider: 'HeyGen', tier: 'balanced', usdPerSec: 0.07, minPer10s: 2.5, maxRes: '1080p', ratios: ALL_RATIOS },
  { id: 'kwaivgi/kling-v3.0-std', name: 'Kling 3.0 Standard', provider: 'Kuaishou', tier: 'balanced', usdPerSec: 0.08, minPer10s: 3, maxRes: '1080p', ratios: ALL_RATIOS },
  { id: 'minimax/hailuo-3', name: 'Hailuo 3', provider: 'MiniMax', tier: 'balanced', usdPerSec: 0.08, minPer10s: 3, maxRes: '1080p', ratios: ['16:9', '9:16'] },
  { id: 'bytedance/seedance-2.5', name: 'Seedance 2.5', provider: 'ByteDance', tier: 'best', usdPerSec: 0.12, minPer10s: 3, maxRes: '1080p', ratios: ALL_RATIOS },
  { id: 'kwaivgi/kling-v3.0-pro', name: 'Kling 3.0 Pro', provider: 'Kuaishou', tier: 'best', usdPerSec: 0.14, minPer10s: 4, maxRes: '1080p', ratios: ALL_RATIOS },
  { id: 'runway/gen-4.5', name: 'Runway Gen-4.5', provider: 'Runway', tier: 'best', usdPerSec: 0.15, minPer10s: 3, maxRes: '1080p', ratios: ['16:9', '9:16'] },
  { id: 'google/veo-3.1', name: 'Veo 3.1', provider: 'Google', tier: 'best', usdPerSec: 0.2, minPer10s: 4, maxRes: '1080p', ratios: ALL_RATIOS },
];
const TIERS = {
  draft: { label: 'Fast draft', prefer: ['bytedance/seedance-2.0-fast', 'alibaba/wan-2.7', 'google/veo-3.1-lite'] },
  balanced: { label: 'Balanced', prefer: ['heygen/heygen-video-1', 'kwaivgi/kling-v3.0-std', 'minimax/hailuo-3'] },
  best: { label: 'Best quality', prefer: ['google/veo-3.1', 'kwaivgi/kling-v3.0-pro', 'runway/gen-4.5', 'bytedance/seedance-2.5'] },
};
const resRank = { '480p': 0, '720p': 1, '1080p': 2 };
const resCost = { '480p': 0.6, '720p': 1, '1080p': 1.5 };
const videoModel = (id) => VIDEO_MODELS.find((m) => m.id === id) || VIDEO_MODELS[3];
const isModelId = (c) => !!c && c.includes('/');
const tierOf = (c) => (isModelId(c) ? videoModel(c).tier : c === 'auto' ? 'balanced' : c);
function modelProblem(m, ratio, res) {
  if (ratio && ratio !== 'auto' && !m.ratios.includes(ratio)) return `Doesn't support ${ratio}`;
  if (res && res !== 'auto' && resRank[res] > resRank[m.maxRes]) return `Only up to ${m.maxRes}`;
  return null;
}
function resolveModel(choice, ratio, res) {
  if (isModelId(choice)) return videoModel(choice);
  const list = (TIERS[tierOf(choice)] || TIERS.balanced).prefer.map(videoModel);
  return list.find((m) => !modelProblem(m, ratio, res)) || list[0];
}
function estimate(m, secs, res) {
  const cost = m.usdPerSec * secs * (resCost[res] || 1);
  const min = Math.max(1, Math.round((m.minPer10s * secs) / 10));
  return { cost, min, text: `≈ $${cost.toFixed(2)} · ~${min} min` };

/* What "Auto" becomes (stands in for Qwen reading the idea). */
const AUTO = {
  ratio(p) {
    if (/\b(vertical|portrait|phones?|tiktok|reels?|shorts|stories)\b/i.test(p)) return ['9:16', 'Your idea mentions phones or Reels'];
    if (/\b(square|feed post|instagram post)\b/i.test(p)) return ['1:1', 'Your idea mentions a square post'];
    return ['16:9', 'Landscape suits most stories'];
  },
  secs(p) {
    const w = p.split(/\s+/).filter(Boolean).length;
    if (!w) return [15, 'Default until you write your idea'];
    const s = w < 12 ? 10 : w < 22 ? 15 : w < 40 ? 20 : 30;
    return [s, `Fits a ${w}-word idea`];

/** Every setting resolved to a concrete value, plus why Auto chose it. */
const RESOLVED = new Map();
function resolved(S, prompt) {
  const key = `${S.videoModel}|${S.aspectRatio}|${S.duration}|${S.videoResolution}|${prompt}`;
  let r = RESOLVED.get(key);

}

  const [aRatio, whyRatio] = AUTO.ratio(prompt), [aSecs, whySecs] = AUTO.secs(prompt);

  const tier = tierOf(S.videoModel);
  const model = resolveModel(S.videoModel, ratio, S.videoResolution);

  const res = S.videoResolution === 'auto' ? 'auto' : S.videoResolution;
  let g2 = `<div class="gh sub">Or pick a specific model</div>`;
  for (const k of ['draft', 'balanced', 'best']) {
    g2 += VIDEO_MODELS.filter((m) => m.tier === k).map((m) => {
      const problem = modelProblem(m, r.ratio, res), est = estimate(m, r.secs, r.res);
      return mItem({ a: 'pick', arg: `videoModel|${m.id}`, sel: choice === m.id, icon: ic(k === 'draft' ? 'bolt' : k === 'best' ? 'auto_awesome' : 'movie', 18), label: m.name, side: `· ${m.provider}`, hint: problem || `${TIERS[k].label} · ${est.text}`, disabled: !!problem });
    }).join('');
  }
  const g3 = `<div class="mnote">Example prices for a ${r.secs} sec, ${r.res} video. The real list and prices come from the backend.</div>`;
  return [g0, g1, g2, g3];
}
function openMenu(field, anchor) {
  if (state.menu && state.menu.field === field) { closeMenu(); return; }
  closeMenu(true);
  state.menu = { field, key: anchor.dataset.key };
  anchor.classList.add('open'); anchor.setAttribute('aria-expanded', 'true');
  drawMenu(anchor);
  ($('#menu .sel') || $('#menu [data-act]'))?.focus({ preventScroll: true });
}
function drawMenu(anchor) {
  const m = state.menu, el = $('#menu');
  if (!m) return;
  anchor = anchor || $(`[data-key="${m.key}"]`);
  el.innerHTML = (m.field === 'videoModel' ? modelMenu() : settingMenu(m.field)).map((g) => `<div class="mgroup">${g}</div>`).join('');
  el.hidden = false;
  placeMenu(anchor);
}
/** Position the open menu next to its row (beside the panel) or above/below it. */
function placeMenu(anchor) {
  const m = state.menu, el = $('#menu');
  if (!m) return;
  anchor = anchor || $(`[data-key="${m.key}"]`);
  if (!anchor) return;
  const r = anchor.getBoundingClientRect(), minW = m.field === 'videoModel' ? 420 : 340;
  const w = Math.min(Math.max(anchor.dataset.side ? 0 : r.width, minW), innerWidth - 16);
  el.style.width = w + 'px'; el.style.maxHeight = '';
  const side = anchor.dataset.side === 'right' && r.right + 14 + w <= innerWidth - 8;
  el.classList.toggle('side', side);
  if (side) {   // beside the panel, lined up with the row
    el.style.maxHeight = innerHeight - 16 + 'px';
    el.style.left = r.right + 14 + 'px';
    el.style.top = clamp(r.top - 8, 8, innerHeight - el.offsetHeight - 8) + 'px';
    el.classList.remove('up');
    return;
  }
  el.style.left = clamp(r.left, 8, innerWidth - w - 8) + 'px';
  const below = innerHeight - r.bottom - 12, above = r.top - 12, h = el.offsetHeight, down = h <= below || below >= above;
  el.style.maxHeight = Math.max(200, down ? below : above) + 'px';
  el.classList.toggle('up', !down);
  el.style.top = (down ? r.bottom + 6 : Math.max(8, r.top - 6 - el.offsetHeight)) + 'px';
}
function closeMenu(silent) {
  if (!state.menu) return;
  const k = state.menu.key; state.menu = null;
  const el = $('#menu'); el.hidden = true; el.innerHTML = '';
  $$('.open[data-key]').forEach((a) => { a.classList.remove('open'); a.setAttribute('aria-expanded', 'false'); });
  if (!silent) $(`[data-key="${k}"]`)?.focus({ preventScroll: true });
}

/* Morphing loading indicator */
const MORPH = ['burst', 'cookie9', 'pentagon', 'oval', 'sunny', 'clover4', 'cookie12'];
let loaderRAF = 0;
function startLoaders() { if (!loaderRAF && !reduceMotion) loaderRAF = requestAnimationFrame(loaderLoop); }
function loaderLoop(now) {
  const els = document.querySelectorAll('[data-loader]');
  if (!els.length) { loaderRAF = 0; return; }
  {
    const cycle = 700, k = Math.floor(now / cycle), u = (now % cycle) / cycle;
    const e = Math.min(1.08, 1 - Math.exp(-7 * u) * Math.cos(11 * u));
    const f1 = SHAPES[MORPH[k % MORPH.length]], f2 = SHAPES[MORPH[(k + 1) % MORPH.length]], rot = (now / 1000) * 2.4 + k * 0.6;
    const cache = {};
    els.forEach((el) => { const s = el.offsetWidth || 24; cache[s] = cache[s] || `path('${shapeD(f1, s, rot, f2, e)}')`; el.style.clipPath = cache[s]; });
  }
  loaderRAF = requestAnimationFrame(loaderLoop);
}

/* Snackbar */
let snackTimer = 0, snackFn = null;
/** action: optional { label, fn }, shown as a text button (e.g. Undo) */
function snack(msg, action) {
  const el = $('#snack');
  snackFn = action?.fn || null;
  el.innerHTML = `<span class="msg">${esc(msg)}</span>${action ? `<button class="snack-act" type="button"${act('snack-act')}>${esc(action.label)}</button>` : ''}<button class="icon-btn sm" type="button" style="color:inherit"${act('snack-close')} aria-label="Dismiss">${ic('close')}</button>`;
  el.classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => el.classList.remove('show'), action ? 6500 : 4200);
}

/* ---- 8. ACTIONS, EVENTS, BOOT -------------------------------------------------------------- */
function setPrompt(text) {
  state.idea.prompt = text;
  ED.value = text; ED.focus();
  patchComposer();
}
async function create() {
  if (state.creating) return;
  const I = state.idea;
  if (!I.prompt.trim()) {
    const c = $('#ai-box'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    ED.focus(); snack('Describe your video first, or use an example');
    return;
  }
  const broken = $('.mention.broken', ED);
  if (broken) {
    const c = $('#ai-box'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    ED.focus(); snack(`@${broken.dataset.name} points to an image you removed. Click the mention to delete it.`);
    return;
  }
  const r = resolved(I, I.prompt);
  state.creating = true; closeMenu(true); patchComposer();
  await new Promise((res) => setTimeout(res, 1600));
  state.creating = false; patchComposer();
  const extras = `${state.audio ? 'audio on' : 'no audio'}${state.refs.length ? `, ${state.refs.length} reference image${state.refs.length > 1 ? 's' : ''}` : ''}`;
  snack(`Storyboard step isn't in this prototype yet · ${r.model.name}, ${r.ratio}, ${r.secs} sec, ${r.res}, ${extras}`);
}
function rerender() {
  const sel = getSelection(), pos = document.activeElement === ED && sel.rangeCount ? [sel.anchorNode, sel.anchorOffset] : null;
  const swap = () => { render(); if (pos) { ED.focus({ preventScroll: true }); try { sel.collapse(pos[0], pos[1]); } catch { edCaretEnd(); } } };
  if (document.startViewTransition && !reduceMotion) document.startViewTransition(swap); else swap();
}

const ACTIONS = {
  theme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = state.theme;
    try { localStorage.setItem('qc_studio_theme', state.theme); } catch { /* storage unavailable */ }
    homeSet('theme', state.theme);   // keep Home in step
    rerender();
  },
  soon: (what) => snack(`${what} is not part of this prototype`),
  'preview-toggle'() {
    // Play if paused by the user or blocked by the browser, otherwise pause.
    previewPaused = !(previewPaused || exVideo.paused);
    setPreviewUi(previewPaused);
    howVisibilityChanged();   // pause: the loop waits; play: the video step restarts from shot 1
  },
  'how-go'(id) { if (id !== howStep && !howBusy) goHow(id); },
  'how-prev'() { const i = HOW.findIndex((t) => t.id === howStep); ACTIONS['how-go'](HOW[(i - 1 + HOW.length) % HOW.length].id); },
  'how-next'() { const i = HOW.findIndex((t) => t.id === howStep); ACTIONS['how-go'](HOW[(i + 1) % HOW.length].id); },
  'use-example'() { if (!state.creating) setPrompt(KEEPER.prompt); },
  surprise() {
    if (state.creating) return;
    const others = EXAMPLES.map((_, i) => i).filter((i) => EXAMPLES[i].prompt !== state.idea.prompt);
    const i = others[Math.floor(Math.random() * others.length)];
    setPrompt(EXAMPLES[i].prompt);
  },
  'open-set'(field, el) { openMenu(field, el); },
  pick(arg) {
    const [field, raw] = arg.split('|'), v = field === 'duration' && raw !== 'auto' ? +raw : raw;
    const key = state.menu?.key;
    closeMenu(true);
    state.idea[field] = v;
    patchComposer();
    $(`[data-key="${key}"]`)?.focus({ preventScroll: true });
  },
  create,
  'sb-toggle'() { homeSet('sidebar', homeGet('sidebar', 'expanded') === 'collapsed' ? 'expanded' : 'collapsed'); applyRail(); },
  'sb-support'() { snack('Support opens the help center in the full app. Nothing happens in this prototype.'); },
  'sb-announce-x'() { homeSet('announce', 'dismissed'); $('#sbAnnounce')?.remove(); $('.sidebar input[name="sbTheme"]:checked')?.focus(); },
  'browse-models'() { const b = $('[data-key="set:videoModel"]'); if (b && !b.disabled) { b.scrollIntoView({ block: 'nearest' }); openMenu('videoModel', b); } },
  'snack-close'() { $('#snack').classList.remove('show'); },
  'snack-act'() { const fn = snackFn; snackFn = null; $('#snack').classList.remove('show'); fn?.(); },
  'toggle-audio'() {
    state.audio = !state.audio;
    patchComposer();
    $('.set-row.toggle')?.focus({ preventScroll: true });
  },
  'add-ref'() { refPending = null; $('#ref-input')?.click(); },
  'ref-mention'(id) { const r = refById(id); if (r && !state.creating) refInsert(r); },
  'remove-ref'(id) { refRemove(id); ED.focus(); },
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (state.menu && !e.target.closest('#menu') && !(t && t.dataset.key === state.menu.key)) closeMenu(true);
  if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
  const fn = ACTIONS[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset.arg, t); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'prompt') { state.idea.prompt = el.value; autogrow(el); patchComposer(); return; }
  if (el.id === 'dur-slider') {
    const v = +el.value, f = (v - 4) / 56, wrap = el.parentElement, bubble = wrap.querySelector('.slider-bubble');
    wrap.style.setProperty('--pct', f * 100 + '%');
    if (bubble) { bubble.textContent = `${v}s`; bubble.style.left = `calc(10px + (100% - 20px) * ${f})`; }
    $('#dur-val').textContent = `${v} sec`;
    state.idea.duration = v;
    patchComposer();
    $$('#menu .mchip').forEach((c) => c.classList.toggle('sel', c.dataset.arg === `duration|${v}`));
    $$('#menu .mi').forEach((c) => { if (c.dataset.arg === 'duration|auto') { c.classList.remove('sel'); c.setAttribute('aria-checked', 'false'); c.querySelector('.mi-check').innerHTML = ''; } });
  }
});
document.addEventListener('keydown', (e) => {
  const ae = document.activeElement;   // the upload box and image cards act as buttons
  if ((e.key === 'Enter' || e.key === ' ') && ae === e.target && ae?.matches('.fu, .fu-file')) { e.preventDefault(); ae.click(); return; }
  if (e.key === 'Escape' && state.menu) { closeMenu(); return; }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && document.activeElement?.closest('#hn')) { e.preventDefault(); ACTIONS[e.key === 'ArrowLeft' ? 'how-prev' : 'how-next'](); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (!state.creating) create(); return; }
  if (state.menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = $$('#menu [data-act]'), i = items.indexOf(document.activeElement);
    e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus();
  }
});
/* Slider bubble shows only while dragging (as in index.html) */
/* Reference images: file picker, drag and drop onto the panel, paste */
document.addEventListener('change', (e) => {
  if (e.target.name === 'sbTheme') { if (e.target.value !== state.theme) ACTIONS.theme(); return; }
  if (e.target.id === 'sbNewUser') { homeSet('newUser', e.target.checked); const b = $('#sbProjects'); if (b) b.textContent = sbProjectCount() || ''; return; }
  if (e.target.id !== 'ref-input') return;
  const added = addRefFiles(e.target.files);
  e.target.value = '';
  const q = refPending; refPending = null;
  if (q && added[0] && ED.contains(q.node)) {   // attached from the @ menu: mention it right there
    const rg = document.createRange(); rg.setStart(q.node, q.start); rg.setEnd(q.node, Math.min(q.end, q.node.length));
    refInsert(added[0], rg);
  } else if (added.length) ED.focus();
});
/* Image cards: ← → move between them; Delete removes one */
document.addEventListener('keydown', (e) => {
  const b = e.target.closest?.('[data-ref-open]'); if (!b) return;
  const all = $$('[data-ref-open]'), i = all.indexOf(b);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); all[(i + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length].focus(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); refRemove(b.dataset.refOpen); ($$('[data-ref-open]')[Math.min(i, state.refs.length - 1)] || ED).focus(); }
});
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragover', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  $('.panel')?.classList.toggle('drop-on', !!e.target.closest?.('.panel'));
});
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget || !e.relatedTarget.closest?.('.panel')) $('.panel')?.classList.remove('drop-on'); });
document.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  $('.panel')?.classList.remove('drop-on');
  if (e.target.closest?.('.panel') && !state.creating && addRefFiles(e.dataTransfer.files).length) ED.focus();
});
document.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith('image/'));
  if (files.length && !state.creating) { e.preventDefault(); addRefFiles(files); }
});
document.addEventListener('pointerdown', (e) => { e.target.closest?.('.slider input')?.parentElement.classList.add('dragging'); });
window.addEventListener('pointerup', () => $$('.slider.dragging').forEach((s) => s.classList.remove('dragging')));
window.addEventListener('resize', bcFit);
let menuRAF = 0;
const queuePlaceMenu = () => { if (state.menu && !menuRAF) menuRAF = requestAnimationFrame(() => { menuRAF = 0; placeMenu(); }); };
window.addEventListener('resize', queuePlaceMenu);
document.addEventListener('scroll', queuePlaceMenu, { passive: true, capture: true });

/* Example preview: step through the shots */
/** Restart the shot clock so the first shot of a step gets its full time. */
function restartShots() {
  clearInterval(shotTimer);
  shotTimer = setInterval(stepExample, SHOT_MS);
}
restartShots();

/* Vertical word carousel */
setInterval(() => {
  const el = $('#rot');
  if (!el || reduceMotion || document.hidden || el.dataset.animating) return;

  el.dataset.animating = 'true';
  rotIdx = (rotIdx + 1) % ROT_WORDS.length;

  const oldWord = document.createElement('span');
  oldWord.className = 'rot-word out';
  oldWord.textContent = el.textContent;

  const newWord = document.createElement('span');
  newWord.className = 'rot-word in';
  newWord.textContent = ROT_WORDS[rotIdx];

  el.style.width = `${el.getBoundingClientRect().width}px`;
  el.replaceChildren(oldWord, newWord);

  const nextWidth = newWord.getBoundingClientRect().width;
  requestAnimationFrame(() => {
    el.style.width = `${nextWidth}px`;
  });

  setTimeout(() => {
    if (!el.isConnected) return;
    el.textContent = ROT_WORDS[rotIdx];
    el.style.width = '';
    delete el.dataset.animating;
  }, 450);
}, 2600);

function boot() {
  try {
    const t = localStorage.getItem('qc_studio_theme'); if (t === 'light' || t === 'dark') state.theme = t;
  } catch { /* storage unavailable */ }
  document.documentElement.dataset.theme = state.theme;
  render();
  /* Fetch the example media once the page has settled */
  if (!HOW_ONLY || HOW_ONLY === 'video') (window.requestIdleCallback || ((cb) => setTimeout(cb, 1200)))(primeExample, { timeout: 2500 });
  if (matchMedia('(min-width: 900px)').matches) $('#prompt')?.focus({ preventScroll: true });
}
boot();
